version: "3.9"

services:
  # ─────────────────────────────────────────────
  # Mock MCP Server: Jira  (port 8081)
  # ─────────────────────────────────────────────
  jira-mock:
    build: ./jira-mock
    container_name: jira-mock
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────
  # Mock MCP Server: Slack  (port 8082)
  # ─────────────────────────────────────────────
  slack-mock:
    build: ./slack-mock
    container_name: slack-mock
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────
  # Mock MCP Server: GitHub  (port 8083)
  # ─────────────────────────────────────────────
  github-mock:
    build: ./github-mock
    container_name: github-mock
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────
  # Mock MCP Server: Google Sheets  (port 8084)
  # ─────────────────────────────────────────────
  sheets-mock:
    build: ./sheets-mock
    container_name: sheets-mock
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────
  # FastAPI Orchestrator Backend  (port 8000)
  # ─────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: bug-router-backend
    ports:
      - "8000:8000"
    environment:
      - JIRA_MCP_URL=http://jira-mock:8081/sse
      - SLACK_MCP_URL=http://slack-mock:8082/sse
      - GITHUB_MCP_URL=http://github-mock:8083/sse
      - SHEETS_MCP_URL=http://sheets-mock:8084/sse
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HITL_DB_PATH=/data/hitl.db
    volumes:
      - hitl_data:/data
    depends_on:
      jira-mock:
        condition: service_healthy
      slack-mock:
        condition: service_healthy
      github-mock:
        condition: service_healthy
      sheets-mock:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # Next.js Control Room Frontend  (port 3000)
  # ─────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: bug-router-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  hitl_data:

